# Enable only after the certificate and basic-auth password file exist.
server {
    listen 217.217.233.149:80;
    listen [::]:80;
    server_name draft.incept.md;
    return 301 https://draft.incept.md$request_uri;
}

server {
    listen 217.217.233.149:443 ssl;
    listen [::]:443 ssl;
    server_name draft.incept.md;

    root /srv/incept.md/draft/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/incept.md-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incept.md-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Draft preview";
    auth_basic_user_file /etc/nginx/draft.incept.md.htpasswd;

    location = /robots.txt {
        auth_basic off;
        try_files $uri =404;
    }

    location /blog/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
