<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ site.Title }}</title>
    {{ $css := resources.Get "css/style.css" | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
        <nav aria-label="Main navigation"><a href="{{ "/blog/" | relURL }}"{{ if eq .Section "blog" }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Blog <span aria-hidden="true">↗</span></a></nav>
    </header>
    <main>
        {{ block "main" . }}{{ end }}
    </main>
</body>
</html>
